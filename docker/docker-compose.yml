services:
  # 1. Data Storage (The "Database")
  vmstorage-1:
    image: victoriametrics/vmstorage:latest
    container_name: vmstorage-1
    volumes:
      - strg-1:/storage
    command:
      - "--storageDataPath=/storage"
      - "--httpListenAddr=:8482"
      - "--vminsertAddr=:8400"
      - "--vmselectAddr=:8401"
    restart: always

  vmstorage-2:
    image: victoriametrics/vmstorage:latest
    container_name: vmstorage-2
    volumes:
      - strg-2:/storage
    command:
      - "--storageDataPath=/storage"
      - "--httpListenAddr=:8482"
      - "--vminsertAddr=:8400"
      - "--vmselectAddr=:8401"
    restart: always

  # 2. Data Ingestion (The "Receiver")
  vminsert:
    image: victoriametrics/vminsert:latest
    container_name: vminsert
    command:
      - "--storageNode=vmstorage-1:8400,vmstorage-2:8400"
      - "--replicationFactor=2" # Ensures data is written to BOTH nodes
    ports:
      - "8480:8480"
    restart: always
    depends_on:
      - vmstorage-1
      - vmstorage-2

  # 3. Data Retrieval (The "Query Engine")
  vmselect:
    image: victoriametrics/vmselect:latest
    container_name: vmselect
    command:
      - "--storageNode=vmstorage-1:8401,vmstorage-2:8401"
    ports:
      - "8481:8481"
    restart: always
    depends_on:
      - vmstorage-1
      - vmstorage-2

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: always

  mktxp:
    image: ghcr.io/akpw/mktxp:latest
    container_name: mktxp
    volumes:
      - ./mktxp:/home/mktxp/mktxp/
    ports:
      - "49090:49090"
    restart: always

volumes:
  strg-1:
  strg-2:
  grafana-data:
