apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoriametrics-cluster
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/nekirc/Monitoring-Stack.git' # Replace with your repo URL
    targetRevision: init-script
    path: Monitoring-Stack/k8s/victoria-metrics
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
