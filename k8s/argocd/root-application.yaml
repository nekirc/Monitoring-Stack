apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/nekirc/Monitoring-Stack.git'
    targetRevision: init-script
    path: k8s/argocd/apps
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
