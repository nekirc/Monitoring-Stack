apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-log-generator-script
  namespace: elastic-system
data:
  app.py: |
    import logging
    import sys
    import time
    import os

    from opentelemetry import _logs, trace, metrics
    from opentelemetry.sdk._logs import LoggerProvider, LoggingHandler
    from opentelemetry.sdk._logs.export import BatchLogRecordProcessor
    from opentelemetry.exporter.otlp.proto.grpc._log_exporter import OTLPLogExporter
    
    from opentelemetry.sdk.trace import TracerProvider
    from opentelemetry.sdk.trace.export import BatchSpanProcessor
    from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter
    
    from opentelemetry.sdk.metrics import MeterProvider
    from opentelemetry.sdk.metrics.export import PeriodicExportingMetricReader
    from opentelemetry.exporter.otlp.proto.grpc.metric_exporter import OTLPMetricExporter

    from opentelemetry.sdk.resources import Resource

    # 1. Identity
    resource = Resource.create({"service.name": "otel-python-app", "environment": "dev"})
    otlp_endpoint = os.getenv("OTEL_EXPORTER_OTLP_ENDPOINT", "http://otel-collector-svc.elastic-system.svc:4317")

    # 2. SETUP LOGS
    logger_provider = LoggerProvider(resource=resource)
    _logs.set_logger_provider(logger_provider)
    logger_provider.add_log_record_processor(BatchLogRecordProcessor(OTLPLogExporter(endpoint=otlp_endpoint, insecure=True)))
    
    console_handler = logging.StreamHandler(sys.stdout)
    console_handler.setFormatter(logging.Formatter('%(asctime)s - %(levelname)s - %(message)s'))
    otel_handler = LoggingHandler(level=logging.NOTSET, logger_provider=logger_provider)
    
    root_logger = logging.getLogger()
    root_logger.setLevel(logging.INFO)
    root_logger.addHandler(console_handler)
    root_logger.addHandler(otel_handler)

    # 3. SETUP TRACES
    trace_provider = TracerProvider(resource=resource)
    trace.set_tracer_provider(trace_provider)
    trace_provider.add_span_processor(BatchSpanProcessor(OTLPSpanExporter(endpoint=otlp_endpoint, insecure=True)))
    tracer = trace.get_tracer("python-app-tracer")

    # 4. SETUP METRICS
    metric_reader = PeriodicExportingMetricReader(OTLPMetricExporter(endpoint=otlp_endpoint, insecure=True), export_interval_millis=10000)
    meter_provider = MeterProvider(resource=resource, metric_readers=[metric_reader])
    metrics.set_meter_provider(meter_provider)
    meter = metrics.get_meter("python-app-meter")
    event_counter = meter.create_counter("app_events_total", description="Total number of generated events")

    print(f"DEBUG: App started. Sending Logs, Traces, and Metrics to {otlp_endpoint}")

    count = 0
    try:
        while True:
            count += 1
            # Generate a Trace Span
            with tracer.start_as_current_span("generate-event-span") as span:
                span.set_attribute("event.iteration", count)
                
                # Generate a Log (which will be automatically linked to the active trace span)
                root_logger.info(f"Generated OTel Event #{count}")
                
                # Increment a Metric
                event_counter.add(1, {"event_type": "automated"})
                
            time.sleep(10)
    except Exception as e:
        print(f"CRITICAL ERROR: {e}")
    finally:
        logger_provider.shutdown()
        trace_provider.shutdown()
        meter_provider.shutdown()
