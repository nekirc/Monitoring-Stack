apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: elastic-system
spec:
  version: 9.3.2
  count: 1
  elasticsearchRef:
    name: elasticsearch
  config:
    xpack.fleet.agents.fleet_server.hosts: ["https://fleet-server-agent-http.elastic-system.svc:8220"]
    xpack.fleet.outputs:
      - id: fleet-default-output
        name: default
        type: elasticsearch
        hosts: ["https://elasticsearch-es-http.elastic-system.svc:9200"]
        is_default: true
        is_default_monitoring: true
        config:
          ssl.verification_mode: none
    
    xpack.fleet.packages:
      - name: fleet_server
        version: latest
      - name: system
        version: latest
      - name: apm
        version: latest

    xpack.fleet.agentPolicies:
      - name: Fleet Server Policy
        id: eck-fleet-server
        is_default_fleet_server: true
        namespace: default
        package_policies:
          - name: fleet_server-1
            package:
              name: fleet_server
            inputs:
              - type: fleet-server
                vars:
                  - name: custom_port
                    value: 8220

      - name: Synthetics Agent Policy
        id: eck-synthetics-policy
        namespace: default
        package_policies:
          - name: system
            package:
              name: system
            
      - name: APM and OTel Policy
        id: eck-apm-otel-policy
        namespace: default
        package_policies:
          - name: apm-integration
            package:
              name: apm
            inputs:
              - type: apm
                vars:
                  - name: host
                    value: "0.0.0.0:8200"
                  - name: tls_enabled
                    value: false
