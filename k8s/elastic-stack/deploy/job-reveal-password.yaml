apiVersion: batch/v1
kind: Job
metadata:
  name: reveal-password
  namespace: elastic-system
  annotations:
    # This hook runs after the sync is successful
    argocd.argoproj.io/hook: PostSync
    # This ensures the job is recreated if you sync again
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: reveal-password-sa
      # We use the default service account, but in some clusters 
      # you might need a Role/RoleBinding to allow reading secrets.
      containers:
      - name: reveal
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Checking for Elasticsearch readiness..."
          # 1. Wait for the Secret to be generated by the Operator
          until kubectl get secret elasticsearch-es-elastic-user -n elastic-system > /dev/null 2>&1; do
            echo "Waiting for elasticsearch-es-elastic-user secret to be created..."
            sleep 10
          done

          # 2. Wait for Elasticsearch pods to be 'Ready'
          kubectl wait --for=condition=Ready pod -l elasticsearch.k8s.elastic.co/cluster-name=elasticsearch -n elastic-system --timeout=300s

          # 3. Wait for Kibana to be 'Ready'
          kubectl wait --for=condition=Ready pod -l kibana.k8s.elastic.co/name=kibana -n elastic-system --timeout=300s

          echo "===================================================="
          echo " STACK IS READY!"
          echo " URL:      https://localhost:5601"
          echo " USERNAME: elastic"
          echo -n " PASSWORD: "
          kubectl get secret elasticsearch-es-elastic-user -n elastic-system -o jsonpath='{.data.elastic}' | base64 -d
          echo -e "\n===================================================="
      restartPolicy: Never
  # Set a backoff limit in case of pull errors or extreme lag
  backoffLimit: 3
