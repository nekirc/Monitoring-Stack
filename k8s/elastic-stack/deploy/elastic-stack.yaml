apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: elastic-system
spec:
  version: 9.3.2
  nodeSets:
  - name: default
    count: 1
    config:
      node.store.allow_mmap: false
    volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: elastic-system
spec:
  version: 9.3.2
  count: 1
  elasticsearchRef:
    name: elasticsearch
  config:
    xpack.fleet.agents.fleet_server.hosts: ["https://fleet-server-agent-http.elastic-system.svc:8220"]
    xpack.fleet.outputs:
      - id: fleet-default-output
        name: default
        type: elasticsearch
        hosts: ["https://elasticsearch-es-http.elastic-system.svc:9200"]
        is_default: true
        is_default_monitoring: true
        config:
          ssl.verification_mode: none
    
    xpack.fleet.packages:
      - name: fleet_server
        version: latest
      - name: system
        version: latest
      - name: synthetics
        version: latest
      - name: apm
        version: latest

    xpack.fleet.agentPolicies:
      - name: Fleet Server Policy
        id: eck-fleet-server
        is_default_fleet_server: true
        namespace: default
        package_policies:
          - name: fleet_server-1
            package:
              name: fleet_server
            inputs:
              - type: fleet-server
                vars:
                  - name: custom_port
                    value: 8220

      - name: Synthetics Policy
        id: eck-synthetics-policy
        namespace: default

      - name: APM and OTel Policy
        id: eck-apm-otel-policy
        namespace: default
        package_policies:
          - name: apm-integration
            package:
              name: apm
            inputs:
              - type: apm
                vars:
                  - name: host
                    value: "0.0.0.0:8200"
                  - name: tls_enabled
                    value: false
---
apiVersion: agent.k8s.elastic.co/v1alpha1
kind: Agent
metadata:
  name: fleet-server
  namespace: elastic-system
spec:
  version: 9.3.2
  kibanaRef:
    name: kibana
  elasticsearchRefs:
    - name: elasticsearch
  mode: fleet
  fleetServerEnabled: true
  policyID: eck-fleet-server
  deployment:
    replicas: 1
    podTemplate:
      spec:
        serviceAccountName: fleet-server
        automountServiceAccountToken: true
        containers:
          - name: agent
            env:
            - name: FLEET_INSECURE
              value: "true"
---
apiVersion: agent.k8s.elastic.co/v1alpha1
kind: Agent
metadata:
  name: synthetics-agent
  namespace: elastic-system
spec:
  version: 9.3.2
  fleetServerRef:
    name: fleet-server
  mode: fleet
  policyID: eck-synthetics-policy
  deployment:
    replicas: 1
    podTemplate:
      spec:
        securityContext:
          runAsUser: 0 
        containers:
          - name: agent
            env:
            - name: FLEET_INSECURE
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: kibana-external
  namespace: elastic-system
spec:
  selector:
    common.k8s.elastic.co/type: kibana
    kibana.k8s.elastic.co/name: kibana
  ports:
    - protocol: TCP
      port: 5601
      targetPort: 5601
  type: LoadBalancer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-server
  namespace: elastic-system
---
# FIXED: Only ONE ClusterRole for fleet-server, containing the 'secrets' resource
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleet-server
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces", "nodes", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleet-server
subjects:
- kind: ServiceAccount
  name: fleet-server
  namespace: elastic-system
roleRef:
  kind: ClusterRole
  name: fleet-server
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reveal-password-sa
  namespace: elastic-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reveal-password-role
  namespace: elastic-system
rules:
- apiGroups: [""]
  resources: ["secrets", "pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reveal-password-rb
  namespace: elastic-system
subjects:
- kind: ServiceAccount
  name: reveal-password-sa
  namespace: elastic-system
roleRef:
  kind: Role
  name: reveal-password-role
  apiGroup: rbac.authorization.k8s.io