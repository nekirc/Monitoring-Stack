apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-log-generator
  namespace: elastic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-log-generator
  template:
    metadata:
      labels:
        app: otel-log-generator
    spec:
      containers:
      - name: python-app
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp;
            python /app/app.py;
        env:
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otel-collector-svc.elastic-system.svc:8200"
        volumeMounts:
        - name: script-volume
          mountPath: /app
      volumes:
      - name: script-volume
        configMap:
          name: otel-log-generator-script
