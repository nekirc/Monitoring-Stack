apiVersion: v1
kind: ConfigMap
metadata:
  name: mktxp-config-template
data:
  _mktxp.conf: |
    [MKTXP]
        listen = '0.0.0.0:49090'
        socket_timeout = 5
        initial_delay_on_failure = 120
        max_delay_on_failure = 900
        delay_inc_div = 5
        bandwidth = False
        bandwidth_test_dns_server = 8.8.8.8
        bandwidth_test_interval = 600
        minimal_collect_interval = 5
        verbose_mode = False
        fetch_routers_in_parallel = False
        max_worker_threads = 5
        max_scrape_duration = 30
        total_max_scrape_duration = 90
        persistent_router_connection_pool = True
        persistent_dhcp_cache = True            
        compact_default_conf_values = False
        prometheus_headers_deduplication = False

  mktxp.conf: |
    [Sample-Router]
        hostname = MKT_HOSTNAME_PLACEHOLDER

    [default]
        enabled = True
        hostname = localhost
        port = 8728
        
        # PLACEHOLDERS
        username = MKT_USER_PLACEHOLDER
        password = MKT_PASS_PLACEHOLDER
        
        credentials_file = ""
        use_ssl = False
        plaintext_login = True
        health = True
        installed_packages = True
        dhcp = True
        interface = True
        route = True
        pool = True
        firewall = True
        neighbor = True
        poe = True
        monitor = True
        netwatch = True
        public_ip = True
        wireless = True
        wireless_clients = True
        capsman = True
        capsman_clients = True
        user = True
        queue = True
        interface_name_format = name
        check_for_updates = False
