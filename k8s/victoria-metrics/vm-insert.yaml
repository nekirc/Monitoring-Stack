apiVersion: v1
kind: Service
metadata:
  name: vminsert-service
spec:
  ports:
    - port: 8480
      targetPort: 8480
      name: insert
  selector:
    app: vminsert
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vminsert
spec:
  replicas: 2 # Scale this up in Portainer if ingestion is slow
  selector:
    matchLabels:
      app: vminsert
  template:
    metadata:
      labels:
        app: vminsert
    spec:
      containers:
      - name: vminsert
        image: victoriametrics/vminsert:latest
        args: 
          - "--storageNode=vmstorage-0.vmstorage:8400"
          - "--storageNode=vmstorage-1.vmstorage:8400"
          - "--replicationFactor=2"
        ports:
          - containerPort: 8480