apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: VictoriaMetrics
      type: prometheus
      access: proxy
      url: http://vmselect-service:8481/select/0/prometheus/
      isDefault: true
      editable: true
      jsonData:
        httpMethod: POST
        prometheusType: Prometheus